name: minecraft-fabric
services:
  mc:
    image: itzg/minecraft-server
    container_name: mc-server-fabric
    restart: unless-stopped
    # bypasses Docker NAT
    network_mode: host
    tty: true
    stdin_open: true
    volumes:
      - /home/gleb/minecraft-fabric/minecraft-data:/data
      - /home/gleb/minecraft-fabric/mods:/data/mods

    deploy:
      resources:
        limits:
          memory: 7G

    environment:
      EULA: "TRUE"
      VERSION: "1.21.10"
      TYPE: "FABRIC"
      DIFFICULTY: "normal"
      ONLINE_MODE: "FALSE"
      ENFORCE_SECURE_PROFILE: "FALSE"

      MEMORY: "6G"
      USE_AIKAR_FLAGS: "true"

      # Bandwidth Cap
      VIEW_DISTANCE: "14"
      SIMULATION_DISTANCE: "9"
      NETWORK_COMPRESSION_THRESHOLD: "512"
  
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:latest
    container_name: cloudflare-ddns
    network_mode: host
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_DDNS_TOKEN}
      - DOMAINS=${DOMAIN}
      - PROXIED=false 
      - IP4_PROVIDER=cloudflare.trace
      - IP6_PROVIDER=none 
      - UPDATE_CRON=@every 5m