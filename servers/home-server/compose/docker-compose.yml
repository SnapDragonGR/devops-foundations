name: compose
services:

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - media_net
    ports:
      - "${SERVER_IP}:8080:8080"
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      #  LAN traffic
      - FIREWALL_OUTBOUND_SUBNETS=192.168.0.0/16,172.16.0.0/12
      - TZ=${TZ}
      # Auto-update qBittorrent's listening port when Proton rotates it
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'sleep 30 && wget -O- --retry-connrefused --waitretry=15 --tries=15 --post-data "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:8080/api/v2/app/setPreferences 2>&1'
    volumes:
      - /srv/media/config/gluetun:/gluetun
    restart: unless-stopped
    mem_limit: 150m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "https://www.google.com"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"  # KILL-SWITCH
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - /srv/media/config/qbittorrent:/config
      - /srv/media/data:/data        # hardlinks
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    networks:
      - media_net
    ports:
      - "${SERVER_IP}:9696:9696"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /srv/media/config/prowlarr:/config
    restart: unless-stopped
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    deploy:
      resources:
        limits:
          memory: 256M

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    networks:
      - media_net
    ports:
      - "${SERVER_IP}:8989:8989"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /srv/media/config/sonarr:/config
      - /srv/media/data:/data
    restart: unless-stopped
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    deploy:
      resources:
        limits:
          memory: 512M

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    networks:
      - media_net
    ports:
      - "${SERVER_IP}:7878:7878"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /srv/media/config/radarr:/config
      - /srv/media/data:/data
    restart: unless-stopped
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    deploy:
      resources:
        limits:
          memory: 512M

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    networks:
      - media_net
    ports:
      - "${SERVER_IP}:6767:6767"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /srv/media/config/bazarr:/config
      - /srv/media/data:/data
    restart: unless-stopped
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    deploy:
      resources:
        limits:
          memory: 256M

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    networks:
      - media_net
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TZ}
    restart: unless-stopped
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    deploy:
      resources:
        limits:
          memory: 1G

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    networks:
      - media_net
    ports:
      - "${SERVER_IP}:8096:8096"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /srv/media/config/jellyfin:/config
      - /srv/media/data/media:/data/media:rw
    restart: unless-stopped
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    networks:
      - media_net
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
    ports:
      - "5055:5055"
    volumes:
      - /srv/media/config/seerr:/app/config
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    restart: unless-stopped

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    networks:
      - media_net
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
      - CRON_SCHEDULE=0 5 * * *
      - RECYCLARR_CREATE_CONFIG=true
    volumes:
      - /srv/media/config/recyclarr:/config
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
  
  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    networks:
      - media_net
    ports:
      - "11011:11011"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - /srv/media/config/cleanuparr:/config
    restart: unless-stopped
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    deploy:
      resources:
        limits:
          memory: 256M

  swag:
    image: lscr.io/linuxserver/swag:latest
    container_name: swag
    cap_add:
      - NET_ADMIN
    networks:
      - media_net
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - URL=${DOMAIN}
      - VALIDATION=dns
      - SUBDOMAINS=wildcard
      - DNSPLUGIN=cloudflare
      - EMAIL=${EMAIL}
    volumes:
      - /srv/media/config/swag:/config
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    ports:
      - "443:443"
      - "80:80"
      - "8443:8443"
    restart: unless-stopped

  fail2ban:
    image: lscr.io/linuxserver/fail2ban:latest
    container_name: fail2ban
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    group_add:
      - "999"
    volumes:
      - /srv/media/config/fail2ban:/config
      - /srv/media/config/swag/log/nginx:/var/log/nginx:ro
      - /var/log/journal:/var/log/journal:ro
      - /srv/media/config/jellyfin/log:/config/log/jellyfin:ro
    restart: unless-stopped

  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    networks:
      - media_net
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8088:80"
    environment:
      - TZ=${TZ}
      - FTLCONF_LOCAL_IPV4=${SERVER_IP}
    volumes:
      - /srv/media/config/pihole/etc-pihole:/etc/pihole
      - /srv/media/config/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    networks:
      - media_net
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
  
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    networks:
      media_net:
        ipv4_address: 172.19.0.50
    environment:
      - TZ=${TZ}
    user: "${PUID}:${PGID}"
    ports:
      - 13378:80
    volumes:
      - /srv/media/data/audiobooks:/audiobooks:rw
      - /srv/media/config/audiobookshelf/config:/config
      - /srv/media/config/audiobookshelf/metadata:/metadata
    restart: unless-stopped
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1

networks:
  media_net:
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "false"
